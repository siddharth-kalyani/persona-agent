[project]
name = "vanimo-infra"
version = "0.1.0"
description = "Vanimo AWS infrastructure (CDK, one regional cell per deployment)"
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.220",
    "constructs>=10.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
