name: ci

# Tests on every feature branch and pull request. `main` runs them through deploy.yml, which calls this
# workflow first and ships only what passed (F14).
on:
  push:
    branches: ["feature/**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when deploy.yml calls this, so the two never share a group.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Local dev runs Postgres 18; keep 17 green too in case Aurora 18 isn't available in a region.
        postgres: ["18", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: app/backend
    env:
      VANIMO_TEST_ADMIN_URL: postgresql://postgres:postgres_ci@localhost:5433/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - run: uv run python -m vanimo.evals --dataset evals/datasets/synthetic_v0.jsonl --drafter reference

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  infra:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/infra
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 app/surfaces/outlook-addin/render_manifest.py https://example.cloudfront.net > /dev/null
