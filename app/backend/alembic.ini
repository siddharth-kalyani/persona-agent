[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# The connection URL comes from VANIMO_DB_OWNER_URL (see migrations/env.py).

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
